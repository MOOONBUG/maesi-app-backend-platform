apiVersion: v1
kind: Namespace
metadata: {name: app-platform}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app-gateway, namespace: app-platform}
spec:
 replicas: 2
 selector: {matchLabels: {app: app-gateway}}
 template:
  metadata: {labels: {app: app-gateway}}
  spec:
   containers:
   - name: app-gateway
     image: ghcr.io/mooonbug/app-gateway:latest
     ports: [{name: http, containerPort: 8080}]
     resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
     securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
     readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
     livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: app-gateway, namespace: app-platform}
spec:
 selector: {app: app-gateway}
 ports: [{port: 80, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: app-gateway, namespace: app-platform}
spec:
 scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: app-gateway}
 minReplicas: 2
 maxReplicas: 10
 metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
