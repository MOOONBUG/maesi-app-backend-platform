<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AppCore Console · 主机与诊断</title>
<style>
:root{--ink:#12212b;--muted:#6b7d86;--line:#dbe5e8;--paper:#f5f8f7;--card:#fff;--accent:#0b7a75;--warn:#c47a20;--bad:#b64242;--shadow:0 18px 50px #12332b12}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 Inter,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:auto;padding:30px 22px}.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}.title{font-size:30px;line-height:1.15;font-weight:750;margin:5px 0}.sub{color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center}button,input,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;color:var(--ink)}button{cursor:pointer;background:var(--ink);color:#fff;border-color:var(--ink);font-weight:650}button.alt{background:#fff;color:var(--ink)}button:disabled{opacity:.55;cursor:wait}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.metric-label{color:var(--muted);font-size:12px}.metric{font-size:27px;font-weight:750;margin-top:5px}.ok{color:var(--accent)}.warn{color:var(--warn)}.bad{color:var(--bad)}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.section-title{font-size:17px;font-weight:750;margin:0 0 14px}.host{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding:15px 0}.host:first-of-type{border-top:0;padding-top:0}.host-name{font-weight:700}.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;background:#e6f4f1;color:var(--accent)}.pill.warn{background:#fff2dc;color:var(--warn)}.facts{display:flex;gap:18px;color:var(--muted);font-size:12px;margin-top:5px}.diag{border-top:1px solid var(--line);padding:12px 0}.diag:first-of-type{border-top:0;padding-top:0}.diag-q{font-weight:650}.diag-meta{font-size:12px;color:var(--muted);margin-top:4px}.empty{color:var(--muted);padding:22px 0}.footer{color:var(--muted);font-size:12px;margin-top:18px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.top{display:block}.toolbar{margin-top:15px}.title{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div><div class="eyebrow">GPUOPS / READ-ONLY OPERATIONS</div><div class="title">主机状态与诊断台</div><div class="sub">用事实指标辅助定位 GPU、显存与驱动问题，不生成虚假状态。</div></div><div class="toolbar"><input id="token" type="password" placeholder="Bearer Token"><button id="refresh">刷新状态</button></div></header>
<section class="grid"><div class="card"><div class="metric-label">服务状态</div><div id="service" class="metric">检查中</div></div><div class="card"><div class="metric-label">GPU 数量</div><div id="gpuCount" class="metric">—</div></div><div class="card"><div class="metric-label">最高温度</div><div id="temp" class="metric">—</div></div><div class="card"><div class="metric-label">诊断记录</div><div id="diagCount" class="metric">—</div></div></section>
<div class="layout"><section class="card"><h2 class="section-title">GPU 主机快照</h2><div id="hosts" class="empty">正在读取主机状态...</div></section><section class="card"><h2 class="section-title">最近诊断记录</h2><div id="diagnostics" class="empty">正在读取诊断记录...</div><div style="margin-top:12px"><button class="alt" id="newDiag">记录测试诊断</button></div></section></div>
<div class="footer">AppCore Service Platform · nvidia-smi 只读采集 · 生产环境建议接入 DCGM Exporter + Prometheus</div>
</div>
<script>
const $=id=>document.getElementById(id); const api=location.protocol==='file:'?'http://127.0.0.1:8000':''; const headers=()=>({'Authorization':'Bearer '+($('token').value||localStorage.getItem('gpuops_token')||'')});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function get(path){const r=await fetch(api+path,{headers:headers()});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function refresh(){localStorage.setItem('gpuops_token',$('token').value);$('service').textContent='检查中';try{const h=await get('/health');$('service').textContent='运行中';$('service').className='metric ok'}catch(e){$('service').textContent='不可达';$('service').className='metric bad'}try{const s=await get('/api/v1/ops/gpu-snapshot');const g=s.gpus||[];$('gpuCount').textContent=g.length;$('temp').textContent=g.length?Math.max(...g.map(x=>Number(x['temperature.gpu'])||0))+' °C':'—';$('hosts').innerHTML=g.length?g.map(x=>`<div class="host"><div><div class="host-name">GPU ${esc(x.index)} · ${esc(x.name)} <span class="pill">FACT</span></div><div class="facts"><span>驱动 ${esc(x.driver_version)}</span><span>温度 ${esc(x['temperature.gpu'])} °C</span></div></div><div class="facts"><span>利用率 ${esc(x['utilization.gpu'])}%</span><span>显存 ${esc(x['memory.used'])}/${esc(x['memory.total'])} MB</span></div></div>`).join(''):`<div class="empty">${esc(s.reason||'当前未发现可用 GPU')}</div>`}catch(e){$('hosts').innerHTML='<div class="empty">状态接口不可用：'+esc(e.message)+'</div>'}$('diagnostics').innerHTML='<div class="empty">诊断记录接口需要数据库表后显示。</div>';$('diagCount').textContent='—';try{const d=await get('/api/v1/ops/diagnostics?limit=5');const rows=d.data||[];$('diagCount').textContent=rows.length;$('diagnostics').innerHTML=rows.length?rows.map(x=>`<div class="diag"><div class="diag-q">${esc(x.question)}</div><div class="diag-meta"><span class="pill ${x.severity==='CRITICAL'?'warn':''}">${esc(x.severity)}</span> · ${esc(x.result_mode)} · ${esc(x.created_at)}</div></div>`).join(''):'<div class="empty">暂无诊断记录</div>'}catch(e){}}
$('refresh').onclick=refresh;$('token').value=localStorage.getItem('gpuops_token')||'';$('newDiag').onclick=async()=>{const b=newDiag;b.disabled=true;try{const r=await fetch(api+'/api/v1/ops/diagnostics',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({question:'GPU 显存持续升高如何排查？',severity:'WARNING'})});const payload=await r.json();if(!r.ok||payload.data?.persisted!==true)throw Error(payload.data?.persistence_reason||'诊断记录未持久化');refresh()}catch(e){alert('记录失败：'+e.message)}finally{b.disabled=false}};refresh();
</script>
</body></html>
